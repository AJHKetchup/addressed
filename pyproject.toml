[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "addressed"
version = "0.1.0"
description = "A local, context-aware alternative to a wake word."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
speech = ["sherpa-onnx==2.0.1", "numpy>=1.26,<3", "sounddevice>=0.5,<1"]

[project.scripts]
addressed = "addressed.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
