[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "addressed"
version = "0.3.2"
description = "A local, context-aware alternative to a wake word."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
speech = ["vosk==0.3.45", "sounddevice>=0.5,<1"]
realtime = ["websockets>=15,<17"]

[project.scripts]
addressed = "addressed.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
